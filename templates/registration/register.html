{% extends 'words/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-dark">
            <div class="card-body p-4">
                <h3 class="page-header text-center">Регистрация</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-crimson w-100">Зарегистрироваться</button>
                </form>
                <hr>
                <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
