{% extends 'words/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-primary text-white text-center"><h3>🔐 Новый пароль</h3></div>
            <div class="card-body">
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Установить пароль</button>
                    </form>
                {% else %}
                    <div class="alert alert-danger">Ссылка недействительна.</div>
                    <a href="{% url 'password_reset' %}" class="btn btn-warning">Запросить новую</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
