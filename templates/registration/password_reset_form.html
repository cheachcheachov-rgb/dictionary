{% extends 'words/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-warning text-dark text-center"><h3>🔑 Восстановление пароля</h3></div>
            <div class="card-body">
                <p>Введите email — отправим инструкцию.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100">Отправить</button>
                </form>
                <hr>
                <a href="{% url 'login' %}">← Вернуться ко входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
