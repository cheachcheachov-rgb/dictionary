{% extends 'words/base.html' %}

{% block content %}
<h1 class="page-header">Управление словами</h1>

<a href="{% url 'add-word' %}" class="btn btn-crimson mb-3">Добавить слово</a>

<table class="table table-dark table-hover" style="background: #222;">
    <thead>
        <tr style="border-bottom: 2px solid #a4161a;">
            <th>ID</th><th>Слово</th><th>Перевод</th><th>Язык</th><th>Действия</th>
        </tr>
    </thead>
    <tbody>
    {% for w in words %}
        <tr>
            <td style="color: #888;">{{ w.id }}</td>
            <td class="word-highlight">{{ w.word }}</td>
            <td>{{ w.translation }}</td>
            <td><span class="badge-crimson">{{ w.get_language_display }}</span></td>
            <td>
                <a href="{% url 'edit-word' w.id %}" class="btn btn-sm btn-crimson">Изменить</a>
                <a href="{% url 'delete-word' w.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
