{% extends 'words/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-dark">
            <div class="card-body p-4">
                <h3 class="page-header">{{ title }}</h3>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label" style="color: #ccc; font-weight: 600;">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger mt-1">{{ field.errors }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-crimson">Сохранить</button>
                    <a href="{% url 'edit-words' %}" class="btn btn-outline-cream">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
